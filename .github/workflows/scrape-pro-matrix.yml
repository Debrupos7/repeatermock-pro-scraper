name: Scrape RepeaterMock PRO Tests v3

on:
  workflow_dispatch:
    inputs:
      max_tests:
        description: 'Max tests per worker (empty = all 9915 / 3 ≈ 3305)'
        required: false
        default: ''
      max_runtime:
        description: 'Max runtime in minutes per worker (default 330 = 5.5h)'
        required: false
        default: '330'

permissions:
  contents: write
  actions: write

concurrency:
  group: scrape-pro-v3
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        worker_id: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install playwright httpx
          playwright install chromium --with-deps

      - name: Pull latest
        run: git pull --rebase origin main || true

      - name: Distribute PRO tests across 3 workers
        env:
          MAX_TESTS: ${{ github.event.inputs.max_tests }}
        run: python3 distribute_pro_tests.py

      - name: Show worker assignment
        run: |
          echo "=========================================="
          echo "  Worker ${{ matrix.worker_id }} assignment:"
          echo "=========================================="
          python3 -c "
          import json
          with open('pro_chunks/worker_${{ matrix.worker_id }}.json') as f:
              d = json.load(f)
          print(f\"Account: {d['account_email']}\")
          print(f\"Total tests: {d['total_tests']}\")
          print(f\"Series: {d['num_series']}\")
          for c in d['chunks']:
                  print(f\"  {c['job_name']:25s} ({c['series_slug']:30s}): {len(c['tests'])} tests\")
          "

      - name: Run PRO scraper (worker ${{ matrix.worker_id }})
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          WORKER_ID: ${{ matrix.worker_id }}
          # All 4 ZenRows keys (comma-separated) — scraper rotates when one is exhausted
          ZENROWS_API_KEYS: ${{ secrets.ZENROWS_API_KEYS }}
          # Per-worker account credentials
          RM_EMAIL_1: ${{ secrets.RM_EMAIL_1 }}
          RM_PASSWORD_1: ${{ secrets.RM_PASSWORD_1 }}
          RM_EMAIL_2: ${{ secrets.RM_EMAIL_2 }}
          RM_PASSWORD_2: ${{ secrets.RM_PASSWORD_2 }}
          RM_EMAIL_3: ${{ secrets.RM_EMAIL_3 }}
          RM_PASSWORD_3: ${{ secrets.RM_PASSWORD_3 }}
        run: |
          python3 pro_scraper.py \
            --worker-file pro_chunks/worker_${{ matrix.worker_id }}.json \
            --output-dir pro_scraped_output \
            --max-runtime ${{ github.event.inputs.max_runtime || '330' }} || true

      - name: Show progress summary
        if: always()
        run: |
          echo "=========================================="
          echo "  PRO SCRAPER v3 — Worker ${{ matrix.worker_id }} Summary"
          echo "=========================================="
          if [ -f "pro_scraped_output/WORKER_${{ matrix.worker_id }}_STATS.json" ]; then
            cat pro_scraped_output/WORKER_${{ matrix.worker_id }}_STATS.json
          fi
          echo ""
          echo "=== Per-series progress (worker ${{ matrix.worker_id }}) ==="
          for dir in pro_scraped_output/*/; do
            job=$(basename "$dir")
            pf="$dir/progress_worker_${{ matrix.worker_id }}.json"
            if [ -f "$pf" ]; then
              python3 -c "
          import json
          with open('$pf') as f:
              p = json.load(f)
          for s, d in p.items():
              sc = len(d.get('scraped',{}))
              fl = len(d.get('failed',{}))
              print(f'  {\"$job\":25s}: {sc} scraped, {fl} failed')
          " 2>/dev/null || true
            fi
          done
          echo "=========================================="

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Pull any concurrent commits from other workers first
          for i in 1 2 3 4 5; do
            git pull --rebase origin main 2>&1 | tail -1
            git add pro_scraped_output/ -f
            git commit -m "pro-scrape v3 w${{ matrix.worker_id }}: $(date -u '+%Y-%m-%d %H:%M UTC')" 2>/dev/null || echo "Nothing to commit"
            if git push origin HEAD 2>&1; then
              echo "Push succeeded attempt $i"
              break
            fi
            sleep $((i * 5))
          done

  trigger_next_round:
    needs: scrape
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Check remaining tests and trigger next round if needed
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git pull --rebase origin main 2>&1 | tail -1 || true
          echo "=========================================="
          echo "  Post-run check — counting remaining PRO tests"
          echo "=========================================="

          REMAINING=$(python3 -c "
          import json, os
          scraped_ids = set()
          # Read all worker progress files and combine
          for root, dirs, files in os.walk('pro_scraped_output'):
              for fn in files:
                  if fn.startswith('progress_worker_') and fn.endswith('.json'):
                      path = os.path.join(root, fn)
                      try:
                          with open(path) as f:
                              d = json.load(f)
                          for series_slug, sd in d.items():
                              for tid in sd.get('scraped', {}).keys():
                                  scraped_ids.add(tid)
                      except Exception as e:
                          pass

          # Total target
          target = 9915

          # If MAX_TESTS env is set (test mode), use that
          max_tests = os.environ.get('INPUT_MAX_TESTS', '').strip()
          if max_tests:
              target = int(max_tests)

          print(max(0, target - len(scraped_ids)))
          " 2>/dev/null || echo "0")

          echo "Remaining PRO tests: $REMAINING"

          if [ "$REMAINING" -gt 0 ]; then
            echo "🔄 Triggering next PRO v3 run with 3 workers..."
            curl -s -X POST \
              -H "Authorization: token $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/Debrupos7/repeatermock-pro-scraper/actions/workflows/scrape-pro-matrix.yml/dispatches" \
              -d '{"ref":"main","inputs":{"max_tests":"","max_runtime":"330"}}' \
              -w "\nTrigger HTTP: %{http_code}\n"
          else
            echo "✅ All PRO tests scraped — no more runs needed!"
          fi
