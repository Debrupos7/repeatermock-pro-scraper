name: Scrape RepeaterMock PRO Tests v2

on:
  workflow_dispatch:
    inputs:
      max_tests:
        description: 'Max tests (empty = all 9915)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: scrape-pro-v2
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install playwright httpx && playwright install chromium --with-deps

      - name: Pull latest
        run: git pull --rebase origin main || true

      - name: Distribute PRO tests
        env:
          MAX_TESTS: ${{ github.event.inputs.max_tests }}
        run: python3 distribute_pro_tests.py

      - name: Run PRO scraper
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          RM_EMAIL: ${{ secrets.RM_EMAIL }}
          RM_PASSWORD: ${{ secrets.RM_PASSWORD }}
        run: |
          python3 pro_scraper.py \
            --chunks pro_chunks/all_chunks.json \
            --output-dir pro_scraped_output \
            --max-runtime 330 || true

      - name: Show progress summary
        if: always()
        run: |
          echo "=========================================="
          echo "  PRO SCRAPER v2 — PROGRESS SUMMARY"
          echo "=========================================="
          if [ -f "pro_scraped_output/PRO_STATS.json" ]; then
            cat pro_scraped_output/PRO_STATS.json
          fi
          echo ""
          echo "=== Per-series progress ==="
          for dir in pro_scraped_output/*/; do
            job=$(basename "$dir")
            if [ -f "$dir/progress.json" ]; then
              python3 -c "
          import json
          with open('$dir/progress.json') as f:
              p = json.load(f)
          for s, d in p.items():
              sc = len(d.get('scraped',{}))
              fl = len(d.get('failed',{}))
              print(f'  {\"$job\":25s}: {sc} scraped, {fl} failed')
          " 2>/dev/null || true
            fi
          done
          echo "=========================================="

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pro_scraped_output/ -f
          git commit -m "pro-scrape v2: $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "Nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main 2>&1 | tail -1
            if git push origin HEAD 2>&1; then
              echo "Push succeeded attempt $i"
              break
            fi
            sleep $((i * 3))
          done

      - name: Trigger next run (auto-continue)
        if: success()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Check if there are remaining tests to scrape
          REMAINING=$(python3 -c "
          import json, os
          # Count scraped
          scraped = 0
          for d in os.listdir('pro_scraped_output'):
              p = f'pro_scraped_output/{d}/progress.json'
              if os.path.exists(p):
                  with open(p) as f:
                      data = json.load(f)
                  for s, dd in data.items():
                      scraped += len(dd.get('scraped', {}))
          print(9915 - scraped)
          " 2>/dev/null || echo "0")
          echo "Remaining tests: $REMAINING"
          if [ "$REMAINING" -gt 0 ]; then
            echo "Triggering next PRO run..."
            curl -s -X POST -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/Debrupos7/repeatermock-pro-scraper/actions/workflows/scrape-pro-matrix.yml/dispatches" -d '{"ref":"main","inputs":{"max_tests":""}}' -w "\nTrigger: %{http_code}\n"
          else
            echo "✅ All PRO tests scraped — no more runs needed!"
          fi
